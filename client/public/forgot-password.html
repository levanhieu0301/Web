<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AutoCare - Quên mật khẩu</title>
    <link rel="stylesheet" href="../css/forgot-password.css" />
  </head>
  <body>
    <!-- HEADER + NAV -->
    <header class="header">
      <nav class="navbar">
        <div class="nav-brand">
          <h1>AutoCare</h1>
        </div>
        <ul class="nav-menu" id="navMenu">
          <li><a href="index.html">Trang chủ</a></li>
          <li><a href="services.html">Dịch vụ</a></li>
          <li><a href="products.html">Sản Phẩm</a></li>
          <li><a href="booking.html">Đặt lịch</a></li>
          <li><a href="login.html">Đăng nhập</a></li>
        </ul>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="forgot-hero">
      <div class="hero-overlay"></div>
      <div class="hero-content">
        <h1>Quên mật khẩu</h1>
        <p>Nhập email để nhận mã OTP và đặt lại mật khẩu</p>
      </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <div class="auth-container">
        <form id="forgotPasswordForm" class="auth-form" novalidate>
          <!-- Bước 1: Nhập email -->
          <div class="form-group">
            <label>Email <span class="required">*</span></label>
            <input
              type="email"
              id="forgotEmail"
              placeholder="email@example.com"
              required
            />
            <div id="forgotEmailError" class="error-message"></div>
          </div>
          <button type="button" id="sendOtpBtn" class="btn btn-primary">
            Gửi OTP
          </button>

          <!-- Bước 2: Hiển thị sau khi gửi OTP thành công -->
          <div id="otpSection" style="display: none; margin-top: 1rem">
            <div class="form-row">
              <div class="form-group">
                <label>Mã OTP <span class="required">*</span></label>
                <input type="text" id="otpInput" placeholder="Nhập mã OTP" />
                <div id="otpError" class="error-message"></div>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label>Mật khẩu mới <span class="required">*</span></label>
                <input
                  type="password"
                  id="newPassword"
                  placeholder="ít nhất 6 ký tự"
                />
                <div id="newPasswordError" class="error-message"></div>
              </div>
              <div class="form-group">
                <label>Nhập lại mật khẩu <span class="required">*</span></label>
                <input
                  type="password"
                  id="confirmPassword"
                  placeholder="Nhập lại mật khẩu"
                />
                <div id="confirmPasswordError" class="error-message"></div>
              </div>
            </div>

            <!-- Checkbox hiển thị mật khẩu chung -->
            <div class="show-password">
              <input type="checkbox" id="showPassword" />
              <label for="showPassword">Hiển thị mật khẩu</label>
            </div>

            <button
              type="submit"
              class="btn btn-primary"
              style="margin-top: 1rem"
            >
              Đặt lại mật khẩu
            </button>
          </div>

          <!-- Thông báo thành công -->
          <div
            id="forgotSuccess"
            class="success-message"
            style="display: none; margin-top: 1rem"
          >
            Mật khẩu đã được đặt lại thành công!
            <a href="login.html">Đăng nhập</a>
          </div>
        </form>
      </div>
    </main>

    <!-- JS -->
    <script src="../js/forgot-password.js"></script>
  </body>
</html>
